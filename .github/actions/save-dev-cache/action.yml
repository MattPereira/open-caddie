name: Save the dev servers' cache
description: >-
  Stops the seed's dev server that setup-agent started with app-mode dev, then
  saves its Turbopack cache for the next run to restore. Make it the job's
  last step, with `if: always()`: the servers are gone after it. Does nothing
  when setup-agent did not start dev servers.

runs:
  using: composite
  steps:
    - name: Stop the seed's dev server
      id: stop
      if: env.APP_MODE == 'dev' && env.NEXT_DEV_CACHE_KEY != ''
      shell: bash
      run: |
        set -uo pipefail
        cache=.next/dev/cache
        if [ ! -d "$cache" ]; then
          echo "No $cache to save."
          exit 0
        fi
        # Turbopack writes its cache a few seconds after it compiles, and a
        # server stopped mid-write leaves it corrupt. So wait until neither
        # the cache nor the server's log (a line per request) has changed for
        # 15 seconds, or two minutes at most.
        for _ in $(seq 24); do
          [ -z "$(find "$cache" /tmp/app-3000.log -mmin -0.25 -print -quit)" ] && break
          sleep 5
        done
        # The restart loop first, so it can't bring the server back.
        pkill -f "setup-agent/serve-dev\.sh 3000( |\$)" || true
        pkill -TERM -f "^node .*next dev -p 3000\$" || true
        for _ in $(seq 30); do
          pgrep -f "^node .*next dev -p 3000\$" > /dev/null || break
          sleep 1
        done
        if pgrep -f "^node .*next dev -p 3000\$" > /dev/null; then
          echo "::warning::The seed's dev server did not stop; not saving its cache."
          exit 0
        fi
        echo "save=true" >> "$GITHUB_OUTPUT"

    - name: Save the cache
      if: steps.stop.outputs.save == 'true'
      uses: actions/cache/save@v6
      with:
        path: .next/dev
        key: ${{ env.NEXT_DEV_CACHE_KEY }}
