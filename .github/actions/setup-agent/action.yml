name: Set up an agent run
description: >-
  Installs the toolchain, Claude Code and agent-browser, then migrates and
  seeds the job's Postgres service, and migrates each Bug Report's database
  that restore-bug-report-snapshots restored. Then it leaves the app running
  on each, as a build or a hot-reloading dev server (server-mode): the seed
  on localhost:3000, Bug Report n's on localhost:3000 + n. Run it after
  checkout (and restore-bug-report-snapshots, if any). The job must set
  DATABASE_URL and DATABASE_DRIVER=node-postgres.

inputs:
  bug-reports:
    description: restore-bug-report-snapshots's bug-reports output. Each has a database open_caddie_bug_<n>.
    required: false
    default: ""
  server-mode:
    description: >-
      build runs `next start` on a build of the code as it was when setup ran.
      dev runs `next dev`, so the agent's edits show without a restart: for
      the roles that edit code. Exported as SERVER_MODE.
    required: false
    default: build

runs:
  using: composite
  steps:
    # Reads the pnpm version from package.json "packageManager".
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Cache agent-browser's Chrome
      uses: actions/cache@v6
      with:
        path: ~/.agent-browser/browsers
        key: agent-browser-0.27.0-${{ runner.os }}

    - name: Install agent-browser
      # The agent drives the app with it for screenshots and checks. Without
      # it here, each run installs it mid-session.
      shell: bash
      run: |
        npm install -g agent-browser@0.27.0
        agent-browser install

    - name: Prepare the databases
      # The repo's checks and pre-commit hook need a real database. It is
      # disposable: a fresh one on every run. The seed is a fixed world
      # (src/seed/world.ts) for the agent to render and screenshot, so it
      # never writes its own rows. Each Bug Report's database gets the
      # branch's migrations on top of prod's, as a deploy would apply them.
      # See docs/agents/agent-browser.md and docs/agents/live-bug-report.md.
      shell: bash
      env:
        BUG_REPORTS: ${{ inputs.bug-reports }}
      run: |
        set -euo pipefail
        pnpm db:migrate
        pnpm db:seed
        for n in $BUG_REPORTS; do
          DATABASE_URL="${DATABASE_URL%/*}/open_caddie_bug_$n" pnpm db:migrate
        done

    - name: Configure auth
      # The secret is throwaway, shared by the servers and `pnpm db:sign-in`
      # for this run. AUTH_URL is the seed server's address, where
      # `pnpm db:sign-in` builds its links by default.
      shell: bash
      run: |
        set -euo pipefail
        echo "AUTH_URL=http://localhost:3000" >> "$GITHUB_ENV"
        echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

    - name: Name the seed's dev cache
      # Unique per run, so every run saves its own and the next run restores
      # the newest one for the same lockfile.
      if: inputs.server-mode == 'dev'
      id: dev-cache
      shell: bash
      run: |
        prefix="next-dev-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "NEXT_DEV_CACHE_KEY=${prefix}${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

    - name: Restore the seed's dev cache
      # Turbopack's dev cache, so routes compile warm. Restore only: the job
      # saves it with save-dev-cache once the seed's server has stopped, as a
      # live server can be mid-write.
      if: inputs.server-mode == 'dev'
      uses: actions/cache/restore@v6
      with:
        path: .next/dev
        key: ${{ env.NEXT_DEV_CACHE_KEY }}
        restore-keys: ${{ steps.dev-cache.outputs.prefix }}

    - name: Start the app
      shell: bash
      env:
        BUG_REPORTS: ${{ inputs.bug-reports }}
        SERVER_MODE: ${{ inputs.server-mode }}
      run: |
        set -euo pipefail
        case "$SERVER_MODE" in
          build | dev) ;;
          *) echo "::error::server-mode must be build or dev, not '$SERVER_MODE'."; exit 1 ;;
        esac
        echo "SERVER_MODE=$SERVER_MODE" >> "$GITHUB_ENV"
        bash "$GITHUB_ACTION_PATH/start-$SERVER_MODE.sh"
