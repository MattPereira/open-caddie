name: Set up an agent run
description: >-
  Installs the toolchain, Claude Code and agent-browser, then migrates the
  job's Postgres service, which copy-prod has filled with prod's data. Run it
  after checkout and copy-prod. The job must set DATABASE_URL and
  DATABASE_DRIVER=node-postgres.

runs:
  using: composite
  steps:
    # Reads the pnpm version from package.json "packageManager".
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Cache agent-browser's Chrome
      uses: actions/cache@v6
      with:
        path: ~/.agent-browser/browsers
        key: agent-browser-0.27.0-${{ runner.os }}

    - name: Install agent-browser
      # The agent drives the app with it for screenshots and checks. Without
      # it here, each run installs it mid-session.
      shell: bash
      run: |
        npm install -g agent-browser@0.27.0
        agent-browser install

    - name: Migrate the database
      # The branch's migrations, on top of prod's (copy-prod), as a deploy
      # would apply them.
      shell: bash
      run: pnpm db:migrate

    - name: Configure auth
      # Where the agent runs the app: Auth.js trusts this host even under
      # `next start`, and `pnpm db:sign-in` builds its links on it. The secret
      # is throwaway, shared by the app and `pnpm db:sign-in` for this run.
      shell: bash
      run: |
        set -euo pipefail
        echo "AUTH_URL=http://localhost:3000" >> "$GITHUB_ENV"
        echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
