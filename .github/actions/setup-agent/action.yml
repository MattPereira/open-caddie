name: Set up an agent run
description: >-
  Installs the toolchain, Claude Code and agent-browser, then copies prod's
  data into the job's Postgres service and migrates it. Run it after checkout.
  The job must set DATABASE_URL and DATABASE_DRIVER=node-postgres.

inputs:
  prod-database-url:
    description: >-
      secrets.PROD_READONLY_DATABASE_URL: a read-only login on prod, used
      only by the copy step below, which runs before any agent exists.
    required: true

runs:
  using: composite
  steps:
    # Reads the pnpm version from package.json "packageManager".
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Cache agent-browser's Chrome
      uses: actions/cache@v6
      with:
        path: ~/.agent-browser/browsers
        key: agent-browser-0.27.0-${{ runner.os }}

    - name: Install agent-browser
      # The agent drives the app with it for screenshots and checks. Without
      # it here, each run installs it mid-session.
      shell: bash
      run: |
        npm install -g agent-browser@0.27.0
        agent-browser install

    - name: Copy prod into the database
      # The agent sees exactly what broke in prod, not a stand-in: a
      # reported URL like /tournaments/62 works as-is. pg_dump runs in the
      # Postgres 18 image because the runner's client is older than prod.
      # Auth tables come over empty: they hold live Google tokens and
      # sessions. Then the branch's own migrations go on top, as a deploy
      # would apply them.
      shell: bash
      env:
        PROD_DATABASE_URL: ${{ inputs.prod-database-url }}
      run: |
        set -euo pipefail
        : "${PROD_DATABASE_URL:?PROD_READONLY_DATABASE_URL is not set}"
        docker run --rm --network host \
          -e PROD_DATABASE_URL -e DATABASE_URL postgres:18 sh -c '
            set -e
            psql -q -v ON_ERROR_STOP=1 "$DATABASE_URL" \
              -c "drop schema if exists public cascade" \
              -c "drop schema if exists drizzle cascade"
            pg_dump "$PROD_DATABASE_URL" --no-owner --no-acl \
              --schema=public --schema=drizzle \
              --exclude-table-data=public.account \
              --exclude-table-data=public.session \
              --exclude-table-data="public.\"verificationToken\"" \
              | psql -q -o /dev/null -v ON_ERROR_STOP=1 "$DATABASE_URL"'
        pnpm db:migrate

    - name: Configure auth
      # Where the agent runs the app: Auth.js trusts this host even under
      # `next start`, and `pnpm db:sign-in` builds its links on it. The secret
      # is throwaway, shared by the app and `pnpm db:sign-in` for this run.
      shell: bash
      run: |
        set -euo pipefail
        echo "AUTH_URL=http://localhost:3000" >> "$GITHUB_ENV"
        echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
