name: Set up an agent run
description: >-
  Installs the toolchain, Claude Code and agent-browser, then migrates and
  seeds the job's Postgres service, and migrates each Bug Report's database
  that restore-bug-report-snapshots restored. Then it leaves a prod build of
  the app running on each: the seed on localhost:3000, Bug Report n's on
  localhost:3000 + n. Run it after checkout (and
  restore-bug-report-snapshots, if any). The job must set DATABASE_URL and
  DATABASE_DRIVER=node-postgres.

inputs:
  bug-reports:
    description: restore-bug-report-snapshots's bug-reports output. Each has a database open_caddie_bug_<n>.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Reads the pnpm version from package.json "packageManager".
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Cache agent-browser's Chrome
      uses: actions/cache@v6
      with:
        path: ~/.agent-browser/browsers
        key: agent-browser-0.27.0-${{ runner.os }}

    - name: Install agent-browser
      # The agent drives the app with it for screenshots and checks. Without
      # it here, each run installs it mid-session.
      shell: bash
      run: |
        npm install -g agent-browser@0.27.0
        agent-browser install

    - name: Prepare the databases
      # The repo's checks and pre-commit hook need a real database. It is
      # disposable: a fresh one on every run. The seed is a fixed world
      # (src/seed/world.ts) for the agent to render and screenshot, so it
      # never writes its own rows. Each Bug Report's database gets the
      # branch's migrations on top of prod's, as a deploy would apply them.
      # See docs/agents/agent-browser.md and docs/agents/live-bug-report.md.
      shell: bash
      env:
        BUG_REPORTS: ${{ inputs.bug-reports }}
      run: |
        set -euo pipefail
        pnpm db:migrate
        pnpm db:seed
        for n in $BUG_REPORTS; do
          DATABASE_URL="${DATABASE_URL%/*}/open_caddie_bug_$n" pnpm db:migrate
        done

    - name: Configure auth
      # The secret is throwaway, shared by the servers and `pnpm db:sign-in`
      # for this run. AUTH_URL is the seed server's address, where
      # `pnpm db:sign-in` builds its links by default.
      shell: bash
      run: |
        set -euo pipefail
        echo "AUTH_URL=http://localhost:3000" >> "$GITHUB_ENV"
        echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

    - name: Start the app
      # Prod builds, so no route compiles on its first request and the agent
      # never sees dev-only behaviour. One server per database: the seed on
      # 3000, Bug Report n's snapshot on 3000 + n. Each gets its own copy of
      # the build, whose data cache would otherwise leak rows between
      # databases (see next.config.ts), and an AUTH_URL of its own address,
      # since Auth.js rejects any other host. The runner kills them at the end
      # of the job. See docs/agents/agent-browser.md.
      shell: bash
      env:
        BUG_REPORTS: ${{ inputs.bug-reports }}
      run: |
        set -euo pipefail
        pnpm build

        start() {
          local port=$1 database_url=$2 dist_dir=${3:-}
          DATABASE_URL="$database_url" AUTH_URL="http://localhost:$port" \
            NEXT_DIST_DIR="$dist_dir" \
            nohup pnpm start -p "$port" > "/tmp/app-$port.log" 2>&1 &
        }
        start 3000 "$DATABASE_URL"
        ports=(3000)
        for n in $BUG_REPORTS; do
          mkdir -p ".next/bug-$n"
          rsync -a --exclude=/cache --exclude='/bug-*' .next/ ".next/bug-$n/"
          port=$((3000 + n))
          start "$port" "${DATABASE_URL%/*}/open_caddie_bug_$n" ".next/bug-$n"
          ports+=("$port")
        done

        for port in "${ports[@]}"; do
          for _ in $(seq 60); do
            curl -s -o /dev/null --max-time 5 "http://localhost:$port/" && continue 2
            sleep 1
          done
          echo "::error::The server on localhost:$port did not answer within a minute."
          cat "/tmp/app-$port.log"
          exit 1
        done
