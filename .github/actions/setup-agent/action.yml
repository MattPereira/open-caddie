name: Set up an agent run
description: >-
  Installs the toolchain, Claude Code and agent-browser, then migrates and
  seeds the job's Postgres service, and migrates each Bug Report's database
  that restore-bug-report-snapshots restored. Then it leaves the app running
  on each, as a prod build or a hot-reloading dev server (app-mode): the seed
  on localhost:3000, Bug Report n's on localhost:3000 + n. Run it after
  checkout (and restore-bug-report-snapshots, if any). The job must set
  DATABASE_URL and DATABASE_DRIVER=node-postgres.

inputs:
  bug-reports:
    description: restore-bug-report-snapshots's bug-reports output. Each has a database open_caddie_bug_<n>.
    required: false
    default: ""
  app-mode:
    description: >-
      prod runs `next start` on a build of the code as it was when setup ran.
      dev runs `next dev`, so the agent's edits show without a restart: for
      the roles that edit code. Exported as APP_MODE.
    required: false
    default: prod

runs:
  using: composite
  steps:
    # Reads the pnpm version from package.json "packageManager".
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Cache agent-browser's Chrome
      uses: actions/cache@v6
      with:
        path: ~/.agent-browser/browsers
        key: agent-browser-0.27.0-${{ runner.os }}

    - name: Install agent-browser
      # The agent drives the app with it for screenshots and checks. Without
      # it here, each run installs it mid-session.
      shell: bash
      run: |
        npm install -g agent-browser@0.27.0
        agent-browser install

    - name: Prepare the databases
      # The repo's checks and pre-commit hook need a real database. It is
      # disposable: a fresh one on every run. The seed is a fixed world
      # (src/seed/world.ts) for the agent to render and screenshot, so it
      # never writes its own rows. Each Bug Report's database gets the
      # branch's migrations on top of prod's, as a deploy would apply them.
      # See docs/agents/agent-browser.md and docs/agents/live-bug-report.md.
      shell: bash
      env:
        BUG_REPORTS: ${{ inputs.bug-reports }}
      run: |
        set -euo pipefail
        pnpm db:migrate
        pnpm db:seed
        for n in $BUG_REPORTS; do
          DATABASE_URL="${DATABASE_URL%/*}/open_caddie_bug_$n" pnpm db:migrate
        done

    - name: Configure auth
      # The secret is throwaway, shared by the servers and `pnpm db:sign-in`
      # for this run. AUTH_URL is the seed server's address, where
      # `pnpm db:sign-in` builds its links by default.
      shell: bash
      run: |
        set -euo pipefail
        echo "AUTH_URL=http://localhost:3000" >> "$GITHUB_ENV"
        echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

    - name: Name the seed's dev cache
      # Unique per run, so every run saves its own and the next run restores
      # the newest one for the same lockfile.
      if: inputs.app-mode == 'dev'
      id: dev-cache
      shell: bash
      run: |
        prefix="next-dev-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "NEXT_DEV_CACHE_KEY=$prefix${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

    - name: Restore the seed's dev cache
      # Turbopack's dev cache, so routes compile warm. Restore only: the job
      # saves it with save-dev-cache once the seed's server has stopped, as a
      # live server can be mid-write.
      if: inputs.app-mode == 'dev'
      uses: actions/cache/restore@v6
      with:
        path: .next/dev
        key: ${{ env.NEXT_DEV_CACHE_KEY }}
        restore-keys: ${{ steps.dev-cache.outputs.prefix }}

    - name: Start the app
      # One server per database: the seed on 3000, Bug Report n's snapshot on
      # 3000 + n. Each gets its own distDir, whose data cache would otherwise
      # leak rows between databases (see next.config.ts), and an AUTH_URL of
      # its own address, since Auth.js rejects any other host. prod copies one
      # build per server. dev runs serve-dev.sh, and only the seed's server
      # gets the restored cache. Never give a snapshot's distDir a copy of it:
      # Turbopack hangs on it and allocates ~700 MB/s until it is OOM-killed.
      # The runner kills them at the end of the job. See
      # docs/agents/agent-browser.md.
      shell: bash
      env:
        BUG_REPORTS: ${{ inputs.bug-reports }}
        APP_MODE: ${{ inputs.app-mode }}
      run: |
        set -euo pipefail
        case "$APP_MODE" in
          prod | dev) ;;
          *) echo "::error::app-mode must be prod or dev, not '$APP_MODE'."; exit 1 ;;
        esac
        echo "APP_MODE=$APP_MODE" >> "$GITHUB_ENV"

        if [ "$APP_MODE" = prod ]; then
          pnpm build
        fi

        start() {
          local port=$1 database_url=$2 dist_dir=${3:-} tsconfig=${4:-}
          local cmd=(pnpm start -p "$port")
          if [ "$APP_MODE" = dev ]; then
            cmd=("$GITHUB_ACTION_PATH/serve-dev.sh" "$port" "$dist_dir")
          fi
          DATABASE_URL="$database_url" AUTH_URL="http://localhost:$port" \
            NEXT_DIST_DIR="$dist_dir" NEXT_TSCONFIG_PATH="$tsconfig" \
            nohup "${cmd[@]}" >> "/tmp/app-$port.log" 2>&1 &
        }

        start 3000 "$DATABASE_URL"
        ports=(3000)
        for n in $BUG_REPORTS; do
          port=$((3000 + n))
          rm -rf ".next/bug-$n"
          mkdir -p ".next/bug-$n"
          if [ "$APP_MODE" = prod ]; then
            rsync -a --exclude=/cache --exclude=/dev --exclude='/bug-*' .next/ ".next/bug-$n/"
            start "$port" "${DATABASE_URL%/*}/open_caddie_bug_$n" ".next/bug-$n"
          else
            # See next.config.ts. Gitignored.
            echo '{ "extends": "./tsconfig.json" }' > "tsconfig.bug-$n.json"
            start "$port" "${DATABASE_URL%/*}/open_caddie_bug_$n" ".next/bug-$n" "tsconfig.bug-$n.json"
          fi
          ports+=("$port")
        done

        # In dev, the first request compiles the route, so give it longer. A
        # server that finds its restored cache corrupt can hang: kill it, and
        # serve-dev.sh restarts it without the cache, logging a
        # "[setup-agent]" line. So a corruption after that line is a new one.
        corrupt_since_restart='/\[setup-agent\]/ { c = 0 } /Cache corruption detected/ { c = 1 } END { exit !c }'
        deadline=$((SECONDS + 300))
        for port in "${ports[@]}"; do
          until curl -s -o /dev/null --max-time 30 "http://localhost:$port/"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The server on localhost:$port did not answer within five minutes."
              cat "/tmp/app-$port.log"
              exit 1
            fi
            if [ "$APP_MODE" = dev ] && awk "$corrupt_since_restart" "/tmp/app-$port.log"; then
              echo "::warning::The dev server on localhost:$port found its cache corrupt; restarting it cold."
              pkill -f "^node .*next dev -p $port\$" || true
              sleep 5
            fi
            sleep 1
          done
        done
