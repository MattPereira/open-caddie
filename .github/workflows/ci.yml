name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only PR runs are cancelled by a newer push; every main commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Build validates the app without Neon provisioning or production secrets.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_caddie_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Throwaway DB for the DB-backed suites; discarded with the runner.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_caddie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # No migrate step: the db project migrates its own template database from
      # TEST_DATABASE_URL. DATABASE_URL is for modules the unit project loads.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_caddie_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_caddie_test
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Restore/save split so red runs still save (actions/cache only saves on
      # success). Keyed per commit; restores the newest from this branch, then
      # main. Both tools recheck changed files, so a stale cache is safe.
      - name: Restore lint/tsc cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
          key: lint-tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            lint-tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Each check runs even if an earlier one fails, so one push surfaces all
      # failures. Skipped if install failed, since every check would fail anyway.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Lint boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint:boundaries

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Lint workflows
        if: ${{ !cancelled() }}
        uses: docker://rhysd/actionlint:1.7.12

      - name: Save lint/tsc cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
          key: lint-tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  changes:
    name: Detect migration changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists PR files via the API
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      # Pushes to main skip because the Vercel production build migrates prod
      # itself. Forks lack the Neon secrets.
      - name: Check for migration changes
        id: filter
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: dorny/paths-filter@v4
        with:
          filters: |
            migrations:
              - 'db/migrations/**'
              - 'src/db/schema.ts'
              - 'drizzle.config.ts'
              - '.github/workflows/ci.yml'

  migrations-prod-data:
    name: Rehearse prod migrations
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Backstop for runs killed before the cleanup step gets to run.
      - name: Compute branch expiry
        id: expiry
        run: echo "at=$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # A fresh copy each run: the PR's preview branch is copied from prod only
      # once and drizzle skips migrations it has recorded, so an edited
      # migration would not be re-tested there.
      - name: Create Neon branch from prod
        id: branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          parent_branch: main
          branch_name: ci/migrate-check/pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ steps.expiry.outputs.at }}

      - name: Migrate
        env:
          # Direct URL: drizzle-kit over the pooler can fail.
          DATABASE_URL: ${{ steps.branch.outputs.db_url }}
        run: pnpm db:migrate

      - name: Delete Neon branch
        if: always() && steps.branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.branch.outputs.branch_id }}

  # The only check the main ruleset needs to require, so jobs can be added,
  # renamed or skipped by editing `needs` here instead of the ruleset.
  # `always()` is load-bearing: without it a failed dependency skips this job,
  # and GitHub counts a skipped required check as passing.
  ci:
    name: Merge gate
    if: always()
    needs: [build, checks, changes, migrations-prod-data]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
