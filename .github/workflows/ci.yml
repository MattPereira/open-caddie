name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only PR runs are cancelled by a newer push; every main commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Throwaway DB for the DB-backed suites; discarded with the runner.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_caddie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # drizzle-kit migrate reads DATABASE_URL; the suites read TEST_DATABASE_URL.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_caddie_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_caddie_test
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Restore/save split so red runs still save (actions/cache only saves on
      # success). Keyed per commit; restores the newest from this branch, then
      # main. Both tools recheck changed files, so a stale cache is safe.
      - name: Restore lint/tsc cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
          key: lint-tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            lint-tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Each check runs even if an earlier one fails, so one push surfaces all
      # failures. Skipped if install failed, since every check would fail anyway.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Migrate test DB
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm db:migrate

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Lint workflows
        if: ${{ !cancelled() }}
        uses: docker://rhysd/actionlint:1.7.12

      - name: Save lint/tsc cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
          key: lint-tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
