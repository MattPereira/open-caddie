name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only PR runs are cancelled by a newer push; every main commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Build validates the app without a Neon database or production secrets.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_caddie_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Throwaway DB for the DB-backed suites; discarded with the runner.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_caddie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # No migrate step: the db project migrates its own template database from
      # TEST_DATABASE_URL. DATABASE_URL is for modules the unit project loads.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_caddie_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_caddie_test
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Restore/save split so red runs still save (actions/cache only saves on
      # success). Keyed per commit; restores the newest from this branch, then
      # main. Both tools recheck changed files, so a stale cache is safe.
      - name: Restore tsc/boundaries cache
        uses: actions/cache/restore@v6
        with:
          path: |
            tsconfig.tsbuildinfo
            node_modules/.cache/dependency-cruiser
          key: tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Each check runs even if an earlier one fails, so one push surfaces all
      # failures. Skipped if install failed, since every check would fail anyway.
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Lint boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint:boundaries

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Lint workflows
        if: ${{ !cancelled() }}
        uses: docker://rhysd/actionlint:1.7.12

      - name: Save tsc/boundaries cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: |
            tsconfig.tsbuildinfo
            node_modules/.cache/dependency-cruiser
          key: tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  # The only check the main ruleset needs to require, so jobs can be added,
  # renamed or skipped by editing `needs` here instead of the ruleset.
  # `always()` is load-bearing: without it a failed dependency skips this job,
  # and GitHub counts a skipped required check as passing.
  merge-gate:
    name: Merge gate
    if: always()
    needs: [build, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
