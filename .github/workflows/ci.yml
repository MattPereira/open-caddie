name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only PR runs are cancelled by a newer push; every main commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Restore/save split so red runs still save (actions/cache only saves on
      # success). Keyed per commit; restores the newest from this branch, then
      # main. Both tools recheck changed files, so a stale cache is safe.
      - name: Restore lint/tsc cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
          key: lint-tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            lint-tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Each check runs even if an earlier one fails, so one push surfaces all
      # failures. Skipped if install failed, since every check would fail anyway.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Save lint/tsc cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
          key: lint-tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
