name: Expand/Contract — Merge Gate

# Holds an expand/contract step's PR until the previous step is in production.
# (.agents/skills/database-migrations/EXPAND-CONTRACT.md)
#
# The danger in expand/contract is two steps shipping in one deploy, or a
# step shipping before the previous one's deploy succeeded. Both happen at
# merge, so this gates the merge, not the start: expand-contract-start.yml
# starts the next step as soon as the previous one merges.
#
# WHAT TRIGGERS IT
#   A pull request opening, pushing, reopening or having its body edited (the
#   body's `Closes #n` decides whether it is gated). And a successful
#   `Production` deploy, reported by Vercel's GitHub integration, which
#   re-checks every open PR that closes an `expand-contract` issue.
#
# WHAT IT DOES
#   .github/scripts/expand-contract.ts gate. Posts the `Previous step deployed`
#   commit status on the PR's head:
#     - success when the PR closes no `expand-contract` issue, so other PRs
#       are not held up by this required check;
#     - success when every blocker of the issue it closes has a merged PR whose
#       merge commit is in the production commit's history;
#     - pending otherwise, naming what it waits for.
#   Ancestry, not "a deploy succeeded": promoting an older deployment does not
#   let the next step merge.
#
#   The production commit is the newest `Production` GitHub deployment whose
#   latest status is success. A Vercel instant rollback records no deployment,
#   so after rolling a step back, hold the next step's merge yourself.
#
#   `pull_request_target`, not `pull_request`: it runs main's script, so a PR
#   cannot edit the gate to pass itself. It checks out no PR code.
#
#   To see what it would post without posting, run the script locally with
#   GH_REPO and DRY_RUN=1 (and PULL to check one PR).
#
# WHAT IT NEEDS
#   secrets.GITHUB_TOKEN only.
#   `Previous step deployed` as a required status check in the `protect main`
#   ruleset.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  deployment_status:

permissions:
  contents: read # the checkout and the compare API
  deployments: read # the production commit
  issues: read # the steps and their blockers
  pull-requests: read # the closing pull requests
  statuses: write # the gate's commit status

jobs:
  gate:
    if: github.event_name == 'pull_request_target' || (github.event.deployment.environment == 'Production' && github.event.deployment_status.state == 'success')
    # Per PR, so a slow older run cannot overwrite a newer run's status. On the
    # job, not the workflow: preview deploy statuses would join the group.
    concurrency:
      group: expand-contract-gate-${{ github.event.pull_request.number || 'deploy' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Post the gate's status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PULL: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROD_SHA: ${{ github.event.deployment.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/expand-contract.ts gate
