name: Expand/Contract — Keep Auto-Merge Steps Up To Date

# Keeps an auto-merging expand/contract step's branch up to date with main.
# (.agents/skills/database-migrations/EXPAND-CONTRACT.md)
#
# `protect main` requires a branch to be up to date before it merges, and
# GitHub's auto-merge does not update it. Without this, a step whose review
# turned auto-merge on (agent-review.yml) would wait forever once anything
# else merged.
#
# WHAT TRIGGERS IT
#   Every push to main.
#
# WHAT IT DOES
#   .github/scripts/expand-contract.ts update. Each open PR that closes an
#   `expand-contract` issue and has auto-merge on gets its branch updated from
#   main, with a merge, not a rebase, so the reviewed commits keep their SHAs.
#   Every other PR is untouched. The update is a push, which re-runs the PR's
#   checks; auto-merge stays on and merges once they pass.
#
#   To see which PRs it would update, run the script locally with GH_REPO and
#   DRY_RUN=1.
#
# WHAT IT NEEDS
#   secrets.FACTORY_PAT, with Contents and Pull requests: write. Not
#   GITHUB_TOKEN: GitHub starts no workflow from a push that token makes, so
#   the required checks would never run on the updated branch.

on:
  push:
    branches: [main]

permissions:
  contents: read # the checkout

# One at a time, so two quick pushes don't both update a branch. A newer push
# replaces a waiting run, which is fine: it updates from the newer main.
concurrency:
  group: expand-contract-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update the auto-merge steps' branches
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/expand-contract.ts update
