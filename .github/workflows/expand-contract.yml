name: Expand/Contract — Start The Next Step

# Starts the next expand/contract step once the previous one is in production.
# (.agents/skills/database-migrations/EXPAND-CONTRACT.md,
# docs/adr/0009-expand-contract-starts-on-deploy.md)
#
# Each step must ship in its own production deploy, after the previous one's.
# Starting a step only once its blockers are in production means its PR can't
# exist earlier, so no merge gate is needed. CI's `Merge gate` job fails a step
# PR that jumps the queue anyway, as a backstop.
#
# WHAT TRIGGERS IT
#   Every push to main. The job waits up to 30 minutes for that commit's
#   `Production` deployment, which Vercel's GitHub integration records. Not
#   `deployment_status`: it can't be narrowed to Production in `on:`, so every
#   preview deploy would add a skipped run to its PR's checks.
#   `workflow_dispatch` re-checks against the current production commit, or a
#   given one, e.g. after a redeploy from the Vercel dashboard.
#
# WHAT IT DOES
#   .github/scripts/expand-contract.ts start. Once the deploy succeeds, every
#   open `expand-contract` issue whose blockers each closed via a merged PR
#   in the deployed commit's history starts: it runs agent-implement.yml on
#   the issue and comments. Every open step, not only this push's, so a failed
#   deploy is caught up by the next one that succeeds. A step with no blocker,
#   or one already started (the start comment, or any linked PR), is skipped.
#   A blocker closed as "not planned" starts nothing.
#
#   A Vercel instant rollback records no GitHub deployment. After rolling a
#   step back, hold the next step yourself.
#
#   To see what it would start without starting it, run the script locally
#   with GH_REPO and DRY_RUN=1 (and SHA to wait on one commit's deploy).
#
# WHAT IT NEEDS
#   secrets.GITHUB_TOKEN only. `workflow_dispatch` is the one event it may
#   start, which is why it runs agent-implement.yml rather than adding the
#   `agent:implement` label: a label it applied would start nothing.
#   Merges to main by a token that starts workflows (agent-review.yml merges
#   with FACTORY_PAT): a push by GITHUB_TOKEN would not run this.
#   The `expand-contract` label:
#     gh label create "expand-contract" --color C5DEF5 \
#       --description "An expand/contract step: starts when its blockers are in production"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "A deployed commit to check against. Empty: the current production commit."
        required: false
        type: string

permissions:
  contents: read # the checkout and the compare API
  deployments: read # the production deploy
  issues: write # the start comment
  pull-requests: read # the closing pull requests
  actions: write # gh workflow run agent-implement.yml

# One at a time, so two runs can't start the same step. A newer run replaces
# a waiting one, which is fine: it scans every step against a newer deploy.
concurrency:
  group: expand-contract
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Start the steps this deploy unblocked
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event_name == 'push' && github.sha || inputs.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/expand-contract.ts start
