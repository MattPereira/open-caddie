# Throwaway check that setup-agent's dev cache round-trips: delete before
# merging #287. Run it twice: the second run should restore the first's cache
# and compile routes faster. With `corrupt`, the run also saves a damaged copy
# as the newest cache, so the next run tests setup-agent's cold restart.
name: Smoke dev cache

on:
  # A workflow_dispatch workflow can only be dispatched once GitHub has seen it
  # run, so the push registers it.
  push:
    branches: [MattPereira/issue-287-dev-servers]
    paths: [.github/workflows/smoke-dev-cache.yml]
  workflow_dispatch:
    inputs:
      corrupt:
        description: Also save a damaged copy of the cache for the next run to restore.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_caddie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/open_caddie
      DATABASE_DRIVER: node-postgres

    steps:
      - uses: actions/checkout@v7

      - name: Name the cache prefix
        # setup-agent's, which job-level env can't compute: no runner or hashFiles there.
        run: echo "CACHE_PREFIX=next-dev-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-" >> "$GITHUB_ENV"

      - name: Look up the cache setup-agent will restore
        # Same prefix as setup-agent, so the newest match is the one it gets.
        id: lookup
        uses: actions/cache/restore@v6
        with:
          path: .next/dev
          key: ${{ env.CACHE_PREFIX }}lookup-only
          restore-keys: ${{ env.CACHE_PREFIX }}
          lookup-only: true

      - name: Set up the agent run
        uses: ./.github/actions/setup-agent
        with:
          app-mode: dev

      - name: Time first compiles
        env:
          MATCHED: ${{ steps.lookup.outputs.cache-matched-key }}
        run: |
          set -uo pipefail
          log=/tmp/app-3000.log
          {
            echo "## Dev cache smoke"
            echo "- Restored: \`${MATCHED:-nothing (cold)}\`"
            echo "- Cold restarts: $(grep -c '\[setup-agent\]' "$log" || true)"
            echo "- Corruption reported: $(grep -c 'Cache corruption detected' "$log" || true)"
            echo
            echo "| Route | First request (s) | Status |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          total=0
          for route in /players /courses /matches /records /tournaments /clubs /login; do
            out=$(curl -s -o /dev/null --max-time 180 \
              -w '%{http_code} %{time_total}' "http://localhost:3000$route" || true)
            status=${out% *} secs=${out#* }
            echo "| $route | $secs | $status |" >> "$GITHUB_STEP_SUMMARY"
            total=$(awk "BEGIN { print $total + ${secs:-0} }")
          done
          echo "| **total** | **$total** | |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$MATCHED" == *-corrupt ]] && ! grep -q '\[setup-agent\]' "$log"; then
            echo "::warning::Restored a corrupt cache but the server never restarted cold: Turbopack tolerated it, or the damage was never read."
          fi

      - name: Save the dev servers' cache
        if: always()
        uses: ./.github/actions/save-dev-cache

      - name: Damage the saved cache
        # Random bytes mid-file in the largest SST, size unchanged, so it reads
        # like a torn write rather than a missing file.
        if: inputs.corrupt
        run: |
          set -euo pipefail
          sst=$(find .next/dev/cache/turbopack -name '*.sst' -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2)
          size=$(stat -c %s "$sst")
          dd if=/dev/urandom of="$sst" bs=1M count=4 seek=$((size / 2 / 1048576)) conv=notrunc status=none
          echo "Damaged $sst ($size bytes)."

      - name: Save the damaged cache as the newest
        if: inputs.corrupt
        uses: actions/cache/save@v6
        with:
          path: .next/dev
          key: ${{ env.NEXT_DEV_CACHE_KEY }}-corrupt

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-logs
          path: /tmp/app-*.log
